spring:
  application:
    name: writelab
  config:
    # Load .env from the working directory or the repo root (when run from backend/).
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/writelab}
    username: ${SPRING_DATASOURCE_USERNAME:writelab}
    password: ${SPRING_DATASOURCE_PASSWORD:writelab}
  flyway:
    enabled: true
  servlet:
    multipart:
      # The application enforces the real 2 MB User Document limit; these caps only keep a much
      # larger request from being buffered, and still return FILE_TOO_LARGE rather than a raw 500.
      max-file-size: 3MB
      max-request-size: 4MB

server:
  port: ${SERVER_PORT:8080}

writelab:
  cors:
    allowed-origins: ${WRITELAB_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  model:
    base-url: ${WRITELAB_MODEL_BASE_URL:https://api.openai.com}
    # A blank API key selects the deterministic Mock mode.
    api-key: ${WRITELAB_MODEL_API_KEY:}
    name: ${WRITELAB_MODEL_NAME:gpt-4o-mini}
    # Independent embedding model; dimensions are fixed at 512 to match halfvec(512).
    # Base URL, API key and timeout are shared with the chat model.
    embedding-name: ${WRITELAB_MODEL_EMBEDDING_NAME:text-embedding-3-small}
    # Per HTTP call. The SDK retries timeouts, so the worst-case wait is
    # timeout x (1 + max-retries).
    timeout: ${WRITELAB_MODEL_TIMEOUT:120s}
    max-retries: ${WRITELAB_MODEL_MAX_RETRIES:1}
  speech:
    # Per STT/TTS provider call. Deliberately much shorter than the chat-model timeout: a spoken
    # turn has a ~2.5s p95 latency budget and must degrade to text instead of waiting silently
    # (ADR-0011).
    timeout: ${WRITELAB_SPEECH_TIMEOUT:10s}
  retrieval:
    # Grounding Material a single Teacher Explanation may cite. min-hits is the deterministic
    # stand-in for the relevance threshold; the vector implementation replaces it with similarity.
    grounding-max-hits: ${WRITELAB_GROUNDING_MAX_HITS:6}
    grounding-per-category-hits: ${WRITELAB_GROUNDING_PER_CATEGORY_HITS:2}
    # Deterministic stand-in: fewer matching notes than this count as no relevant material.
    grounding-min-hits: ${WRITELAB_GROUNDING_MIN_HITS:2}
    # Vector mode replaces min-hits with cosine similarity; below the threshold counts as no
    # relevant material. Tuned by the offline evaluation (docs/retrieval-evaluation.md): 0.60 keeps
    # every labelled material while cutting the average returned list from 4.0 to 2.6 notes.
    grounding-similarity-threshold: ${WRITELAB_GROUNDING_SIMILARITY_THRESHOLD:0.6}
    # User Document citations in one Teacher Explanation. Mock mode ranks chunks by pg_trgm
    # character-trigram similarity; the default threshold is tuned for Chinese notes with short
    # English examples.
    user-document-max-hits: ${WRITELAB_USER_DOCUMENT_MAX_HITS:4}
    user-document-per-document-hits: ${WRITELAB_USER_DOCUMENT_PER_DOCUMENT_HITS:2}
    user-document-similarity-threshold: ${WRITELAB_USER_DOCUMENT_SIMILARITY_THRESHOLD:0.55}
  documents:
    max-file-bytes: ${WRITELAB_DOCUMENT_MAX_FILE_BYTES:2097152}
    max-documents: ${WRITELAB_DOCUMENT_MAX_DOCUMENTS:50}
    max-chunks: ${WRITELAB_DOCUMENT_MAX_CHUNKS:5000}
    chunk-target-min-tokens: ${WRITELAB_DOCUMENT_CHUNK_MIN_TOKENS:300}
    chunk-target-max-tokens: ${WRITELAB_DOCUMENT_CHUNK_MAX_TOKENS:500}
    chunk-overlap-ratio: ${WRITELAB_DOCUMENT_CHUNK_OVERLAP_RATIO:0.15}
    chunker-version: ${WRITELAB_DOCUMENT_CHUNKER_VERSION:document-chunker-v1}

logging:
  level:
    # Keep full prompts and model secrets out of ordinary logs.
    org.springframework.ai: WARN
    com.openai: WARN
