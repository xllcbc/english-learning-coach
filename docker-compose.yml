services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: writelab-postgres
    environment:
      POSTGRES_DB: writelab
      POSTGRES_USER: writelab
      POSTGRES_PASSWORD: writelab
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - writelab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writelab -d writelab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  writelab-pgdata:
